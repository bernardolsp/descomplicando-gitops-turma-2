# Stage: staging
#
# O Stage staging recebe Freight do Stage DEV.
# Só pode receber Freight que ja foi promovido com sucesso em dev.

apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: staging
  namespace: kargo-demo
  annotations:
    kargo.akuity.io/color: "#FF9800"
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: demo
      sources:
        stages:
          - dev
  
  promotionTemplate:
    spec:
      steps:
        - uses: git-clone
          config:
            repoURL: https://github.com/bernardolsp/microservicos-argocd-treinamento
            checkout:
              - branch: main
                path: ./src
              - branch: env/staging
                create: true
                path: ./out

        - uses: git-clear
          config:
            path: ./out

        - uses: copy
          config:
            inPath: ./src/rollouts/kargo-k8s/base
            outPath: ./out/base

        - uses: copy
          config:
            inPath: ./src/rollouts/kargo-k8s/overlays/staging
            outPath: ./out/overlays/staging

        - uses: kustomize-set-image
          as: update-image
          config:
            path: ./out/overlays/staging
            images:
              - image: docker.io/devlopesbernardo/version-app
                tag: '${{ imageFrom("docker.io/devlopesbernardo/version-app").Tag }}'

        - uses: git-commit
          as: commit
          config:
            path: ./out
            message: '${{ outputs["update-image"].commitMessage }}'

        - uses: git-push
          config:
            path: ./out

        - uses: argocd-update
          config:
            apps:
              - name: demo-staging
                namespace: argocd
                sources:
                  - repoURL: https://github.com/bernardolsp/microservicos-argocd-treinamento
                    desiredRevision: '${{ outputs["commit"].commit }}'
  
  verification:
    analysisTemplates:
      - name: health-check
