# Stage: prod
#
# O Stage prod recebe Freight do Stage STAGING.
# E o ambiente de producao - ultimo do pipeline.

apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: kargo-demo
  annotations:
    kargo.akuity.io/color: "#F44336"
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: demo
      sources:
        stages:
          - staging
        requiredSoakTime: 1h  # Freigth precisa "cozinhar" 1h em staging antes de ir para prod
  
  promotionTemplate:
    spec:
      steps:
        - uses: git-clone
          config:
            repoURL: https://github.com/bernardolsp/microservicos-argocd-treinamento
            checkout:
              - branch: main
                path: ./src
              - branch: env/prod
                create: true
                path: ./out

        - uses: git-clear
          config:
            path: ./out

        - uses: copy
          config:
            inPath: ./src/rollouts/kargo-k8s/base
            outPath: ./out/base

        - uses: copy
          config:
            inPath: ./src/rollouts/kargo-k8s/overlays/prod
            outPath: ./out/overlays/prod

        - uses: kustomize-set-image
          as: update-image
          config:
            path: ./out/overlays/prod
            images:
              - image: docker.io/devlopesbernardo/version-app
                tag: '${{ imageFrom("docker.io/devlopesbernardo/version-app").Tag }}'

        - uses: git-commit
          as: commit
          config:
            path: ./out
            message: '${{ outputs["update-image"].commitMessage }}'

        - uses: git-push
          config:
            path: ./out

        - uses: argocd-update
          config:
            apps:
              - name: demo-prod
                namespace: argocd
                sources:
                  - repoURL: https://github.com/bernardolsp/microservicos-argocd-treinamento
                    desiredRevision: '${{ outputs["commit"].commit }}'
  
  verification:
    analysisTemplates:
      - name: health-check
